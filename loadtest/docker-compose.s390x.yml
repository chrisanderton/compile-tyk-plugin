services:
  redis:
    image: redis:6.0-alpine
    healthcheck: { test: ["CMD","redis-cli","--raw","incr","ping"], interval: 3s, retries: 10, timeout: 5s }
  gw:
    image: ${GATEWAY_IMAGE:-tykio/tyk-gateway:v5.13.0}
    platform: linux/s390x            # emulated via qemu-s390x (big-endian!)
    depends_on: [redis]
    volumes:
      # expanded plugin name set by e2e-compose.sh ($PLUGIN_FILE); plugin.so fallback for manual use
      - ./test-plugin/${PLUGIN_FILE:-plugin.so}:/opt/tyk-gateway/middleware/${PLUGIN_FILE:-plugin.so}
      - ./test-plugin/apidef.json:/opt/tyk-gateway/apps/testplugin.json
    ports: ["8080:8080"]
    environment: [TYK_DB_REDISHOST=redis, TYK_LOGLEVEL=debug]
  httpbin.org:
    image: kennethreitz/httpbin
    platform: linux/amd64
