# Real load test: arm64 Gateway v5.13.0 loading a plugin built by the new
# compiler toolchain. Mirrors upstream ci/tests/plugin-compiler/docker-compose.yml.
services:
  redis:
    image: redis:6.0-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 3s
      retries: 10
      timeout: 5s

  gw:
    image: ${GATEWAY_IMAGE:-tykio/tyk-gateway:v5.13.0}
    depends_on: [redis]
    volumes:
      - ./test-plugin/plugin.so:/opt/tyk-gateway/middleware/plugin.so
      - ./test-plugin/apidef.json:/opt/tyk-gateway/apps/testplugin.json
    ports:
      - "8080:8080"
    environment:
      - TYK_DB_REDISHOST=redis
      - TYK_LOGLEVEL=debug

  # Service literally named httpbin.org so the apidef target_url resolves here.
  httpbin.org:
    image: kennethreitz/httpbin
