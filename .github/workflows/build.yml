name: build

# compile-tyk-plugin - community/unofficial multi-arch compiler for Tyk Go plugins.
# Give it a Gateway version; it resolves the commit + exact Go toolchain from the
# published Gateway image, builds the compiler ON TOP OF the prebuilt base, gates it,
# and publishes to BOTH Docker Hub and GHCR under your personal namespace.
#
# The STABLE base layer is NOT built here - it is built once by build-base.yml and this
# workflow just `FROM`s the published compile-tyk-plugin-base:latest. Run build-base.yml
# (variant dhi) before the first build / after a base CVE bump; watch.yml orchestrates both.
#
# Required configuration (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USER   - repository VARIABLE: Docker Hub username + push namespace
#                      (not a secret - it is the registry namespace and must be readable)
#   DOCKERHUB_TOKEN  - repository SECRET:   Docker Hub PAT with Read & Write
# GHCR uses the built-in GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      gateway_version:
        description: "Gateway version, e.g. v5.13.0"
        required: true
        type: string
      push:
        description: "Push to registries"
        required: false
        type: boolean
        default: true
      gateway_image_repo:
        description: "CE Gateway image to resolve+gate against (override for a custom build)"
        required: false
        type: string
        default: tykio/tyk-gateway
      gateway_ee_repo:
        description: "EE Gateway image (override for a custom build)"
        required: false
        type: string
        default: tykio/tyk-gateway-ee
      gateway_fips_repo:
        description: "FIPS Gateway image (override for a custom build)"
        required: false
        type: string
        default: tykio/tyk-gateway-fips
      source_repo:
        description: "Gateway source repo to vendor (override for a fork)"
        required: false
        type: string
        default: TykTechnologies/tyk
      source_ref:
        description: "Gateway source ref (default: the version tag)"
        required: false
        type: string
        default: ""
      glibc_target:
        description: "Plugin glibc floor: 2.17 (RHEL 7+, default) or 2.31 (Debian; newer glibc fns)"
        required: false
        type: string
        default: "2.17"
  workflow_call:
    inputs:
      gateway_version:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: true
      glibc_target:
        required: false
        type: string
        default: "2.17"
      gateway_image_repo:
        required: false
        type: string
        default: tykio/tyk-gateway
      gateway_ee_repo:
        required: false
        type: string
        default: tykio/tyk-gateway-ee
      gateway_fips_repo:
        required: false
        type: string
        default: tykio/tyk-gateway-fips
      source_repo:
        required: false
        type: string
        default: TykTechnologies/tyk
      source_ref:
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_TOKEN:
        required: true

env:
  IMAGE_NAME: compile-tyk-plugin          # change to e.g. "tpc" to rename everywhere
  GHCR_NS: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # ---- 1. Resolve from the Gateway version + pin the prebuilt base ------------
  resolve:
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.r.outputs.GO_VERSION }}
      gateway_trimpath: ${{ steps.r.outputs.GATEWAY_TRIMPATH }}
      gateway_src_root: ${{ steps.r.outputs.GATEWAY_SRC_ROOT }}
      github_sha: ${{ steps.r.outputs.GITHUB_SHA }}
      github_tag: ${{ steps.r.outputs.GITHUB_TAG }}
      sha_amd64:  ${{ steps.r.outputs.GO_SHA256_amd64 }}
      sha_arm64:  ${{ steps.r.outputs.GO_SHA256_arm64 }}
      base_ref:   ${{ steps.basepin.outputs.ref }}
      date:       ${{ steps.meta.outputs.date }}
      dh_ns:      ${{ steps.meta.outputs.dh_ns }}
      glibc_suffix: ${{ steps.meta.outputs.glibc_suffix }}
      ee_available:      ${{ steps.r.outputs.EE_AVAILABLE }}
      ee_build_tag:      ${{ steps.r.outputs.EE_BUILD_TAG }}
      fips_available:    ${{ steps.r.outputs.FIPS_AVAILABLE }}
      fips_gofips140:    ${{ steps.r.outputs.FIPS_GOFIPS140 }}
      fips_goexperiment: ${{ steps.r.outputs.FIPS_GOEXPERIMENT }}
      fips_build_tag:    ${{ steps.r.outputs.FIPS_BUILD_TAG }}
      ce_archs:         ${{ steps.r.outputs.CE_ARCHS }}
      ee_archs:         ${{ steps.r.outputs.EE_ARCHS }}
      fips_archs:       ${{ steps.r.outputs.FIPS_ARCHS }}
      gate_matrix:       ${{ steps.gm.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      # Variables cannot be declared "required" in workflow_call, so guard at runtime.
      - name: Check required config
        env:
          DH_USER: ${{ vars.DOCKERHUB_USER }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DH_USER" ]  || { echo "::error::Set repository VARIABLE DOCKERHUB_USER (Settings -> Secrets and variables -> Actions -> Variables). It is your Docker Hub username and push namespace."; exit 1; }
          [ -n "$DH_TOKEN" ] || { echo "::error::Set repository SECRET DOCKERHUB_TOKEN (a Docker Hub Read & Write PAT)."; exit 1; }
      - uses: imjasonh/setup-crane@v0.4
      - uses: actions/setup-go@v6
        with:
          go-version: "stable"
          # Only used for `go version -m` in resolve-gateway.sh; no modules are
          # downloaded on the runner (that happens inside Dockerfile.release), so the
          # default module cache is pointless and warns about a missing go/pkg/mod.
          cache: false
      - name: Login to Docker Hub
        # authenticate tykio/* gateway pulls in resolve-gateway.sh to dodge Docker Hub's
        # anonymous rate limit (shared runner IP -> i/o timeouts that retries can't clear).
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: r
        env:
          GATEWAY_REPO: ${{ inputs.gateway_image_repo }}
          GATEWAY_EE_REPO: ${{ inputs.gateway_ee_repo }}
          GATEWAY_FIPS_REPO: ${{ inputs.gateway_fips_repo }}
        run: ./scripts/resolve-gateway.sh "${{ inputs.gateway_version }}"
      - name: Login to GHCR (read the prebuilt base digest)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "dh_ns=${{ vars.DOCKERHUB_USER }}" >> "$GITHUB_OUTPUT"
          # Non-default glibc floors get a tag + buildcache suffix so an opt-in 2.31 build
          # never overwrites the canonical 2.17 default images (empty suffix => 2.17, untouched).
          g="${{ inputs.glibc_target }}"; g="${g:-2.17}"
          if [ "$g" = "2.17" ]; then echo "glibc_suffix=" >> "$GITHUB_OUTPUT"; else echo "glibc_suffix=-glibc$g" >> "$GITHUB_OUTPUT"; fi
      # Pin the base built by build-base.yml. The compiler FROMs this exact digest and
      # inherits its io.ctp.dhi-base-digest label, so the gate + the watcher's level-trigger
      # are unchanged. Fails fast with guidance if the base has not been built yet.
      - id: basepin
        env:
          SFX: ${{ steps.meta.outputs.glibc_suffix }}
        run: |
          base="ghcr.io/${GHCR_NS}/${IMAGE_NAME}-base:latest${SFX}"
          d="$(crane digest "$base")" || { echo "::error::base image $base not found - run build-base.yml (variant dhi${SFX:+, glibc_target ${SFX#-glibc}}) first."; exit 1; }
          echo "ref=ghcr.io/${GHCR_NS}/${IMAGE_NAME}-base@${d}" >> "$GITHUB_OUTPUT"
      # Build the gate matrix from the per-edition published architectures - DATA-DRIVEN:
      # each {edition,arch} that a Gateway actually ships gets gated (s390x via qemu).
      - id: gm
        env:
          TAG: ${{ steps.r.outputs.GITHUB_TAG }}
          CE_REPO: ${{ inputs.gateway_image_repo }}
          EE_REPO: ${{ inputs.gateway_ee_repo }}
          FIPS_REPO: ${{ inputs.gateway_fips_repo }}
        run: |
          set -euo pipefail
          entries() {  # edition  gateway  "arch,list"
            for a in $(echo "$3" | tr ',' ' '); do
              case "$a" in
                arm64) runner=ubuntu-24.04-arm; build=arm64; qemu=false ;;
                amd64) runner=ubuntu-latest;    build=amd64; qemu=false ;;
                *)     runner=ubuntu-latest;    build=amd64; qemu=true  ;;  # s390x etc. via qemu
              esac
              echo "{\"edition\":\"$1\",\"arch\":\"$a\",\"gateway\":\"$2:$TAG\",\"runner\":\"$runner\",\"build_arch\":\"$build\",\"qemu\":$qemu}"
            done
          }
          # if/then (not `[ ] && entries`): a false edition check must NOT leave the block
          # with a non-zero exit, or pipefail+set -e fails the step for CE-only releases
          # (no EE/FIPS - e.g. v5.0.x, and the v5.3 LTS: EE starts 5.7, FIPS starts 5.8).
          {
            entries ce "$CE_REPO" "${{ steps.r.outputs.CE_ARCHS }}"
            if [ "${{ steps.r.outputs.EE_AVAILABLE }}" = "true" ];   then entries ee "$EE_REPO" "${{ steps.r.outputs.EE_ARCHS }}"; fi
            if [ "${{ steps.r.outputs.FIPS_AVAILABLE }}" = "true" ]; then entries ee-fips "$FIPS_REPO" "${{ steps.r.outputs.FIPS_ARCHS }}"; fi
          } | jq -sc . | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"

  # ---- 2. Build the compiler ONCE per arch, push to GHCR by digest -----------
  #         The compiler image is EDITION-AGNOSTIC (edition is a runtime -e EDITION flag),
  #         so it is built once per arch and reused by every gate cell AND by publish -
  #         instead of rebuilding it for each {edition, arch}. Native runners, no QEMU.
  #         FROMs the prebuilt base pinned by resolve (no base build here).
  build-candidate:
    needs: [resolve]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5            # this repo: provides Dockerfile.release
      - name: Checkout Gateway source @ release commit
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || needs.resolve.outputs.github_tag }}
          path: tyk-src
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: tyk-src
          file: Dockerfile.release
          platforms: linux/${{ matrix.arch }}
          provenance: true
          sbom: true
          # push-by-digest: no tag, just an immutable digest the gate + publish reference.
          outputs: type=image,name=ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BASE_IMAGE=${{ needs.resolve.outputs.base_ref }}
            GO_VERSION=${{ needs.resolve.outputs.go_version }}
            GATEWAY_TRIMPATH=${{ needs.resolve.outputs.gateway_trimpath }}
            GATEWAY_SRC_ROOT=${{ needs.resolve.outputs.gateway_src_root }}
            GO_SHA256_amd64=${{ needs.resolve.outputs.sha_amd64 }}
            GO_SHA256_arm64=${{ needs.resolve.outputs.sha_arm64 }}
            GITHUB_SHA=${{ needs.resolve.outputs.github_sha }}
            GITHUB_TAG=${{ needs.resolve.outputs.github_tag }}
            EE_AVAILABLE=${{ needs.resolve.outputs.ee_available }}
            EE_BUILD_TAG=${{ needs.resolve.outputs.ee_build_tag }}
            FIPS_AVAILABLE=${{ needs.resolve.outputs.fips_available }}
            FIPS_GOFIPS140=${{ needs.resolve.outputs.fips_gofips140 }}
            FIPS_GOEXPERIMENT=${{ needs.resolve.outputs.fips_goexperiment }}
            FIPS_BUILD_TAG=${{ needs.resolve.outputs.fips_build_tag }}
            CE_ARCHS=${{ needs.resolve.outputs.ce_archs }}
            EE_ARCHS=${{ needs.resolve.outputs.ee_archs }}
            FIPS_ARCHS=${{ needs.resolve.outputs.fips_archs }}
          cache-from: type=registry,ref=ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}${{ needs.resolve.outputs.glibc_suffix }}
          cache-to: type=registry,ref=ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}${{ needs.resolve.outputs.glibc_suffix }},mode=max
      - name: Export per-arch digest
        run: |
          mkdir -p /tmp/digest
          printf '%s' "${{ steps.build.outputs.digest }}" > /tmp/digest/${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-digest-${{ matrix.arch }}
          path: /tmp/digest/${{ matrix.arch }}
          retention-days: 1

  # ---- 3. GATE: pull the per-arch candidate and load a real plugin into the matching
  #         Gateway for every {edition, arch}. No build here - just the ABI proof.
  gate:
    needs: [resolve, build-candidate]
    strategy:
      fail-fast: false
      # Data-driven: one entry per {edition, published arch}. New architectures (e.g. s390x
      # EE/FIPS) appear here automatically once the Gateway ships them. Native architectures
      # run on native runners; others (s390x) run the Gateway under QEMU.
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.gate_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up QEMU (emulate the target-arch Gateway, e.g. s390x)
        if: ${{ matrix.qemu }}
        uses: docker/setup-qemu-action@v4
      - name: Login to Docker Hub
        # the gate pulls the tykio/* Gateway image; authenticate to dodge anon rate limits
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR (pull candidate)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: candidate-digest-${{ matrix.build_arch }}
          path: /tmp/digest
      - name: Gate - ${{ matrix.edition }} / ${{ matrix.arch }} (must load into its Gateway)
        run: |
          DIGEST="$(cat /tmp/digest/${{ matrix.build_arch }})"
          ./scripts/loadtest-gate.sh \
            "ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }}@${DIGEST}" \
            ${{ matrix.gateway }} ${{ matrix.edition }} ${{ matrix.arch }}

  # ---- 4. PUBLISH: stitch the gated per-arch images into one multi-arch manifest and
  #         tag it in GHCR + Docker Hub. NO rebuild - we publish the exact images the
  #         gate proved load into the Gateway. imagetools copies blobs cross-registry.
  publish:
    needs: [resolve, build-candidate, gate]
    if: ${{ inputs.push }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-digest-*
          path: /tmp/digest
          merge-multiple: true
      - name: Assemble multi-arch manifest from the gated per-arch images
        env:
          GHCR_IMG: ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }}
          DH_IMG: docker.io/${{ needs.resolve.outputs.dh_ns }}/${{ env.IMAGE_NAME }}
          TAG: ${{ needs.resolve.outputs.github_tag }}
          DATE: ${{ needs.resolve.outputs.date }}
          SFX: ${{ needs.resolve.outputs.glibc_suffix }}
        run: |
          AMD="$(cat /tmp/digest/amd64)"
          ARM="$(cat /tmp/digest/arm64)"
          # ${SFX} keeps an opt-in 2.31 build on its own tags (e.g. :v5.13.0-glibc2.31), never
          # overwriting the 2.17 default (:v5.13.0). Empty for 2.17.
          # index:* annotations land on the multi-arch manifest list itself - that is what
          # GHCR/GitHub reads for the package "description" (a per-arch image LABEL does not
          # propagate to the index). Source links the package to the repo.
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=compile-tyk-plugin" \
            --annotation "index:org.opencontainers.image.description=Community/unofficial modern low-CVE compiler for Tyk Go plugins (DHI base, glibc-2.17 sysroot default). Not affiliated with Tyk." \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.licenses=MPL-2.0" \
            -t "${GHCR_IMG}:${TAG}${SFX}" -t "${GHCR_IMG}:${TAG}${SFX}-${DATE}" \
            -t "${DH_IMG}:${TAG}${SFX}"   -t "${DH_IMG}:${TAG}${SFX}-${DATE}" \
            "${GHCR_IMG}@${AMD}" "${GHCR_IMG}@${ARM}"
