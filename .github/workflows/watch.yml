name: watch

# What to build/maintain is declared in releases.yml (the support policy) and resolved by
# scripts/resolve-releases.sh into ACTIVE (base-CVE-updated) + FROZEN (built once, kept) sets,
# intersected with buildable Gateway versions (git tag AND published image). This watcher acts on
# that, prune.yml enforces the same policy on the registry - one source of truth, no drift.
#
# Triggers:
#   * MISSING IMAGE     -> build it (new gateway release, or first-run backfill of a maintained
#                          line's older/frozen patches). Both DHI + Wolfi.
#   * EDITION/ARCH DRIFT -> rebuild (ACTIVE only; e.g. an edition gains s390x).
#   * NEW BASE DIGEST   -> re-stack the ACTIVE set on the fresh base. DHI and Wolfi bases are
#                          watched INDEPENDENTLY (a DHI change re-stacks DHI only; Wolfi -> Wolfi).
# Editions ce/ee/ee-fips all ship from one image per version. See docs/maintenance.md + SUPPORT.md.

on:
  schedule:
    - cron: "17 6 * * *"            # daily ~06:17 UTC
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild all maintained versions regardless of changes"
        required: false
        type: boolean
        default: false
      max_dispatch:
        description: "Cap builds dispatched per run (throttles the first-run backfill; raise for faster catch-up)"
        required: false
        type: string
        default: "12"

permissions:
  contents: read
  actions: write                      # dispatch build.yml
  packages: read                      # read existing tags / base label

env:
  IMAGE_NAME: compile-tyk-plugin
  DHI_BASE: dhi.io/debian-base:trixie-debian13-dev
  WOLFI_BASE: cgr.dev/chainguard/wolfi-base:latest
  GHCR_NS: ${{ github.repository_owner }}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check required config
        env:
          DH_USER: ${{ vars.DOCKERHUB_USER }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DH_USER" ]  || { echo "::error::Set repository VARIABLE DOCKERHUB_USER (Docker Hub username + push namespace)."; exit 1; }
          [ -n "$DH_TOKEN" ] || { echo "::error::Set repository SECRET DOCKERHUB_TOKEN (Docker Hub Read & Write PAT)."; exit 1; }
      - uses: imjasonh/setup-crane@v0.4
      - name: Login to dhi.io
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Docker Hub
        # authenticated crane ls/manifest against tykio/* (avoids anonymous rate limits)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide what to (re)build and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
          MAX_DISPATCH: ${{ inputs.max_dispatch || '12' }}
          SOURCE_REPO: TykTechnologies/tyk
          GW_CE_REPO: tykio/tyk-gateway
        run: |
          set -euo pipefail
          base_ref="ghcr.io/${GHCR_NS}/${IMAGE_NAME}-base:latest"
          img="ghcr.io/${GHCR_NS}/${IMAGE_NAME}"

          # --- has the DHI base changed since we last built our base? ---
          dhi_now="$(crane digest "${DHI_BASE}")"
          dhi_last="$(crane config "$base_ref" 2>/dev/null \
                      | jq -r '.config.Labels["io.ctp.dhi-base-digest"] // empty' || true)"
          dhi_changed=false
          [ "$dhi_now" != "$dhi_last" ] && dhi_changed=true
          echo "DHI now=$dhi_now last=${dhi_last:-<none>} changed=$dhi_changed"

          # --- has the WOLFI base changed since we last built our wolfi base? ---
          # (Independent from DHI: the two bases update on their own schedules. The wolfi base
          # records its source digest in the same io.ctp.dhi-base-digest label.)
          wbase_ref="ghcr.io/${GHCR_NS}/${IMAGE_NAME}-base-wolfi:latest"
          wolfi_now="$(crane digest "${WOLFI_BASE}")"
          wolfi_last="$(crane config "$wbase_ref" 2>/dev/null \
                        | jq -r '.config.Labels["io.ctp.dhi-base-digest"] // empty' || true)"
          wolfi_changed=false
          [ "$wolfi_now" != "$wolfi_last" ] && wolfi_changed=true
          echo "WOLFI now=$wolfi_now last=${wolfi_last:-<none>} changed=$wolfi_changed"

          # Editions (ce/ee/fips) all ship from ONE image per version. Resolve releases.yml (the
          # support policy) into the concrete sets: ACTIVE = base-CVE-updated (moving tag re-stacked,
          # snapshots kept); FROZEN = built once and kept, no further base updates. Build set =
          # ACTIVE + FROZEN. Only ACTIVE is re-stacked on a base change. One source of truth, shared
          # with prune.yml, so they cannot drift.
          resolved="$(GW_CE_REPO="$GW_CE_REPO" SOURCE_REPO="$SOURCE_REPO" bash scripts/resolve-releases.sh)"
          active="$(printf '%s\n' "$resolved" | awk '$1=="ACTIVE"{print $2}')"
          frozen="$(printf '%s\n' "$resolved" | awk '$1=="FROZEN"{print $2}')"
          build_set="$(printf '%s\n' $active $frozen | grep -E '^v' | sort -uV | uniq || true)"
          [ -n "$build_set" ] || { echo "::error::empty policy set (resolve-releases failed?) - aborting"; exit 1; }
          echo "policy: $(printf '%s\n' $active|grep -c .) active, $(printf '%s\n' $frozen|grep -c .) frozen ($(printf '%s\n' $build_set|grep -c .) kept)"

          # Decisions are per-variant (DHI / Wolfi independent). Gateway-driven work (new image /
          # arch drift) applies to both; base-CVE re-stacks only to the variant whose base moved.
          live_archs() { crane manifest "$1" 2>/dev/null \
            | jq -r '[.manifests[]?|select((.platform.os//"")=="linux" and (.platform.architecture//"")!="unknown")|.platform.architecture]|sort|unique|join(",")' 2>/dev/null || true; }
          need_dhi=""; need_wolfi=""

          # (1) Build any KEPT version (ACTIVE or FROZEN) that has no image yet - new releases plus
          #     the one-time backfill of a maintained line's older patches. Per variant.
          for v in $build_set; do
            crane manifest "${img}:${v}"       >/dev/null 2>&1 || { echo "-> $v: no DHI image";   need_dhi="$need_dhi $v"; }
            crane manifest "${img}:${v}-wolfi" >/dev/null 2>&1 || { echo "-> $v: no Wolfi image"; need_wolfi="$need_wolfi $v"; }
          done
          # (2) Edition/arch drift (e.g. an edition gains s390x) -> rebuild. ACTIVE only - FROZEN
          #     versions are deliberately not refreshed.
          for v in $active; do
            cfg="$(crane config "${img}:${v}" 2>/dev/null || echo '{}')"
            [ "$cfg" = '{}' ] && continue   # not built yet; step (1) covers it
            for spec in "ce:tykio/tyk-gateway" "ee:tykio/tyk-gateway-ee" "fips:tykio/tyk-gateway-fips"; do
              ed="${spec%%:*}"; gw="${spec##*:}"
              live="$(live_archs "${gw}:${v}")"; have="$(echo "$cfg" | jq -r --arg k "io.ctp.${ed}-archs" '.config.Labels[$k] // ""')"
              [ "$live" != "$have" ] && { echo "-> $v: $ed arch drift ('${have}' -> '${live}')"; need_dhi="$need_dhi $v"; need_wolfi="$need_wolfi $v"; }
            done
          done
          # (3) Base CVE re-stack -> ACTIVE set only, independent per variant.
          if [ "$dhi_changed" = "true" ]   || [ "$FORCE_ALL" = "true" ]; then echo "-> DHI base changed/forced - re-stack ACTIVE";   need_dhi="$need_dhi $active"; fi
          if [ "$wolfi_changed" = "true" ] || [ "$FORCE_ALL" = "true" ]; then echo "-> Wolfi base changed/forced - re-stack ACTIVE"; need_wolfi="$need_wolfi $active"; fi

          # dedupe + cap per run (MAX_DISPATCH spreads a big first-run backfill over days), dispatch.
          dhi_uniq="$(echo $need_dhi     | tr ' ' '\n' | grep -E '^v' | sort -u | head -n "${MAX_DISPATCH}" || true)"
          wolfi_uniq="$(echo $need_wolfi | tr ' ' '\n' | grep -E '^v' | sort -u | head -n "${MAX_DISPATCH}" || true)"
          [ -n "$dhi_uniq$wolfi_uniq" ] || { echo "nothing to build"; exit 0; }
          for v in $dhi_uniq;   do echo "dispatch DHI $v";   gh workflow run build.yml       -f gateway_version="$v" -f push=true || echo "WARN: dhi dispatch failed $v";   done
          for v in $wolfi_uniq; do echo "dispatch Wolfi $v"; gh workflow run build-wolfi.yml -f gateway_version="$v" -f push=true || echo "WARN: wolfi dispatch failed $v"; done
