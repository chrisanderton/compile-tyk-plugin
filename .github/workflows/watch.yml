name: watch

# What to build/maintain is declared in releases.yml (the support policy) and resolved by
# scripts/resolve-releases.sh into ACTIVE (base-CVE-updated) + FROZEN (built once, kept) sets,
# intersected with buildable Gateway versions (git tag AND published image). prune.yml enforces
# the same policy on the registry - one source of truth, no drift.
#
# Three jobs, so the base is built ONCE and release builds only consume it:
#   plan   -> resolve policy + detect drift. Outputs: which base(s) are stale, the capped
#             oldest-first version lists to (re)build, and whether the main package exists yet.
#   base   -> if a base is stale, call build-base.yml (workflow_call) to rebuild JUST that
#             variant ONCE, before any release fans out. busybox (native+x) and Wolfi move INDEPENDENTLY.
#   fanout -> dispatch build.yml / build-wolfi.yml per version. They FROM the (now fresh) base,
#             so a mass re-stack is N cheap release builds, not N base rebuilds.
#
# Triggers a version (re)build when:
#   * MISSING IMAGE      -> new gateway release, or first-run backfill of a frozen patch.
#   * EDITION/ARCH DRIFT -> rebuild (ACTIVE only; e.g. an edition gains s390x).
#   * STALE BASE         -> any ACTIVE version whose recorded io.ctp.dhi-base-digest != the live
#                           base. LEVEL-triggered per version, so a capped/failed run just catches
#                           up next time - no silent staleness.
# Editions ce/ee/ee-fips all ship from one image per version. See docs/maintenance.md + SUPPORT.md.

on:
  schedule:
    - cron: "17 6 * * *"            # daily ~06:17 UTC
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild both bases and re-stack all maintained versions regardless of changes"
        required: false
        type: boolean
        default: false
      max_dispatch:
        description: "Manual-only cap on builds dispatched THIS run (TOTAL across variants; re-stacks are picked before backfill). Empty = no cap. Scheduled runs are always uncapped."
        required: false
        type: string
        default: ""
      dry_run:
        description: "Plan only - log what would be (re)built and dispatched; build no base and dispatch nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write                      # dispatch build.yml / build-wolfi.yml
  packages: write                     # the base job (build-base via workflow_call) pushes

env:
  IMAGE_NAME: compile-tyk-plugin
  # busybox-glibc base (free, non-FIPS). SWAP to dhi.io/busybox:1-debian-fips-dev once entitled.
  BUSYBOX_BASE: dhi.io/busybox:1-debian-dev
  WOLFI_BASE: cgr.dev/chainguard/wolfi-base:latest
  GHCR_NS: ${{ github.repository_owner }}

jobs:
  # ---- 1. Resolve policy + detect base/version drift -------------------------
  plan:
    runs-on: ubuntu-latest
    outputs:
      base_variant:    ${{ steps.d.outputs.base_variant }}    # space-separated subset of {native,x,wolfi}, or none
      native_versions: ${{ steps.d.outputs.native_versions }} # space list, capped, oldest-first
      x_versions:      ${{ steps.d.outputs.x_versions }}
      wolfi_versions:  ${{ steps.d.outputs.wolfi_versions }}
      main_missing:   ${{ steps.d.outputs.main_missing }}    # true | false (lone-first guard)
    steps:
      - uses: actions/checkout@v5
      - name: Check required config
        env:
          DH_USER: ${{ vars.DOCKERHUB_USER }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DH_USER" ]  || { echo "::error::Set repository VARIABLE DOCKERHUB_USER (Docker Hub username + push namespace)."; exit 1; }
          [ -n "$DH_TOKEN" ] || { echo "::error::Set repository SECRET DOCKERHUB_TOKEN (Docker Hub Read & Write PAT)."; exit 1; }
      - uses: imjasonh/setup-crane@v0.4
      - name: Login to dhi.io
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Docker Hub
        # authenticated crane ls/manifest against tykio/* (avoids anonymous rate limits)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve policy and decide what is stale
        id: d
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
          MAX_DISPATCH: ${{ inputs.max_dispatch }}
          SOURCE_REPO: TykTechnologies/tyk
          GW_CE_REPO: tykio/tyk-gateway
        run: |
          set -euo pipefail
          img="ghcr.io/${GHCR_NS}/${IMAGE_NAME}"

          # Live base digests - what a base/compiler SHOULD be stacked on. native + x share the
          # busybox upstream (they differ only by the cross toolchains added on top).
          bb_now="$(crane digest "${BUSYBOX_BASE}")"
          wolfi_now="$(crane digest "${WOLFI_BASE}")"
          echo "live base: BUSYBOX=$bb_now WOLFI=$wolfi_now"

          # Resolve releases.yml -> ACTIVE (base-CVE-current) + FROZEN (built once, kept).
          resolved="$(GW_CE_REPO="$GW_CE_REPO" SOURCE_REPO="$SOURCE_REPO" bash scripts/resolve-releases.sh)"
          active="$(printf '%s\n' "$resolved" | awk '$1=="ACTIVE"{print $2}')"
          frozen="$(printf '%s\n' "$resolved" | awk '$1=="FROZEN"{print $2}')"
          [ -n "$active$frozen" ] || { echo "::error::empty policy set (resolve-releases failed?) - aborting"; exit 1; }
          echo "policy: $(printf '%s\n' $active|grep -c .) active, $(printf '%s\n' $frozen|grep -c .) frozen"

          # || true: a MISSING image makes crane fail; under pipefail that would kill the
          # whole step at `wolfi_have="$(base_of ...)"` for any version not built yet. Treat a
          # missing/label-less image as "" (== not on the live base) instead of crashing.
          base_of()   { crane config "$1" 2>/dev/null | jq -r '.config.Labels["io.ctp.dhi-base-digest"] // empty' 2>/dev/null || true; }
          live_archs(){ crane manifest "$1" 2>/dev/null \
            | jq -r '[.manifests[]?|select((.platform.os//"")=="linux" and (.platform.architecture//"")!="unknown")|.platform.architecture]|sort|unique|join(",")' 2>/dev/null || true; }

          # (A) Is the BASE LAYER itself stale? (missing, or built on an older upstream digest)
          # native (-base) and x (-base-x) both record the busybox upstream digest and go stale
          # exactly when busybox does (tracked separately so a lagged build still catches up).
          native_base_have="$(base_of "${img}-base:latest")"
          x_base_have="$(base_of "${img}-base-x:latest")"
          wolfi_base_have="$(base_of "${img}-base-wolfi:latest")"
          native_base_stale=false; x_base_stale=false; wolfi_base_stale=false
          if [ "$FORCE_ALL" = "true" ] || [ "$native_base_have" != "$bb_now"    ]; then native_base_stale=true; fi
          if [ "$FORCE_ALL" = "true" ] || [ "$x_base_have"      != "$bb_now"    ]; then x_base_stale=true;      fi
          if [ "$FORCE_ALL" = "true" ] || [ "$wolfi_base_have"  != "$wolfi_now" ]; then wolfi_base_stale=true;  fi
          bv=""
          [ "$native_base_stale" = true ] && bv="$bv native"
          [ "$x_base_stale"      = true ] && bv="$bv x"
          [ "$wolfi_base_stale"  = true ] && bv="$bv wolfi"
          bv="$(echo $bv | xargs || true)"; [ -n "$bv" ] || bv=none
          echo "base_variant=$bv" >> "$GITHUB_OUTPUT"
          echo "base: NATIVE stale=$native_base_stale (on ${native_base_have:-<missing>}); X stale=$x_base_stale (on ${x_base_have:-<missing>}); WOLFI stale=$wolfi_base_stale (on ${wolfi_base_have:-<missing>}) -> rebuild='$bv'"

          # (B) Which VERSIONS need a (re)build - LEVEL-triggered per version (compare each image's
          #     recorded base to live). Converges even when capped/failed: laggards catch up next run.
          #     Each candidate is tagged "tier version variant": tier 1 = RE-STACK (the image exists
          #     but is on a stale base - a served-stale image to make current), tier 2 = BACKFILL
          #     (the image is missing - first build). Used only to order a capped (manual) run.
          cand=""
          add() { cand="$cand$(printf '\n%s %s %s' "$1" "$2" "$3")"; }
          for v in $active; do
            cfg="$(crane config "${img}:${v}" 2>/dev/null || echo '{}')"
            native_have="$(echo "$cfg" | jq -r '.config.Labels["io.ctp.dhi-base-digest"] // empty')"
            if [ "$FORCE_ALL" = "true" ] || [ "$native_have" != "$bb_now" ]; then [ "$cfg" = '{}' ] && add 2 "$v" native || add 1 "$v" native; fi
            x_have="$(base_of "${img}:${v}-x")"   # -x re-stacks on the same busybox digest as native
            if [ "$FORCE_ALL" = "true" ] || [ "$x_have" != "$bb_now" ]; then [ -z "$x_have" ] && add 2 "$v" x || add 1 "$v" x; fi
            wolfi_have="$(base_of "${img}:${v}-wolfi")"
            if [ "$FORCE_ALL" = "true" ] || [ "$wolfi_have" != "$wolfi_now" ]; then [ -z "$wolfi_have" ] && add 2 "$v" wolfi || add 1 "$v" wolfi; fi
            # edition/arch coverage drift (read from the existing default image) -> re-stack all variants
            [ "$cfg" = '{}' ] && continue
            for spec in "ce:tykio/tyk-gateway" "ee:tykio/tyk-gateway-ee" "fips:tykio/tyk-gateway-fips"; do
              ed="${spec%%:*}"; gw="${spec##*:}"
              live="$(live_archs "${gw}:${v}")"; have="$(echo "$cfg" | jq -r --arg k "io.ctp.${ed}-archs" '.config.Labels[$k] // ""')"
              if [ "$live" != "$have" ]; then echo "-> $v: $ed arch drift ('${have}' -> '${live}')"; add 1 "$v" native; add 1 "$v" x; add 1 "$v" wolfi; fi
            done
          done
          # FROZEN: build once if the image is missing (backfill); never re-stacked on a base change.
          for v in $frozen; do
            crane manifest "${img}:${v}"       >/dev/null 2>&1 || { echo "-> $v: no native image (frozen)"; add 2 "$v" native; }
            crane manifest "${img}:${v}-x"     >/dev/null 2>&1 || { echo "-> $v: no -x image (frozen)";     add 2 "$v" x; }
            crane manifest "${img}:${v}-wolfi" >/dev/null 2>&1 || { echo "-> $v: no Wolfi image (frozen)";  add 2 "$v" wolfi; }
          done

          # Order: re-stacks (tier 1) before backfills (tier 2), oldest-first within each tier.
          # The cap is MANUAL-ONLY and a GLOBAL TOTAL: applied only when a positive max_dispatch was
          # supplied. Scheduled runs (and manual runs with no value) dispatch everything needed.
          ranked="$(printf '%s\n' "$cand" | grep -E '^[12] v' | sort -u | sort -k1,1n -k2,2V)"
          if printf '%s' "${MAX_DISPATCH:-}" | grep -qE '^[1-9][0-9]*$'; then
            ranked="$(printf '%s\n' "$ranked" | head -n "$MAX_DISPATCH")"
            echo "cap: $MAX_DISPATCH total (manual) - re-stacks first, then backfill"
          else
            echo "cap: none (uncapped) - dispatching all $(printf '%s\n' "$ranked" | grep -c .) needed builds"
          fi
          native_uniq="$(printf '%s\n' "$ranked" | awk '$3=="native"{print $2}')"
          x_uniq="$(printf '%s\n' "$ranked"      | awk '$3=="x"{print $2}')"
          wolfi_uniq="$(printf '%s\n' "$ranked"  | awk '$3=="wolfi"{print $2}')"
          echo "native_versions=$(echo $native_uniq)" >> "$GITHUB_OUTPUT"
          echo "x_versions=$(echo $x_uniq)"           >> "$GITHUB_OUTPUT"
          echo "wolfi_versions=$(echo $wolfi_uniq)"   >> "$GITHUB_OUTPUT"
          echo "to build: NATIVE=[$(echo $native_uniq)] X=[$(echo $x_uniq)] WOLFI=[$(echo $wolfi_uniq)]"

          # (C) Does the main package exist yet? If not, fan-out must seed ONE build first so the
          #     package is created+linked serially (else N concurrent first-pushes race on creation).
          if gh api "/users/${GHCR_NS}/packages/container/${IMAGE_NAME}" >/dev/null 2>&1; then
            echo "main_missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "main_missing=true" >> "$GITHUB_OUTPUT"
            echo "compile-tyk-plugin package absent -> first-seed (lone-first) guard active"
          fi

  # ---- 2. Build the stale base(s) ONCE, before any release fans out ----------
  base:
    needs: plan
    if: ${{ needs.plan.outputs.base_variant != 'none' && !inputs.dry_run }}
    uses: ./.github/workflows/build-base.yml
    with:
      variant: ${{ needs.plan.outputs.base_variant }}
      glibc_target: "2.17"
    secrets: inherit

  # ---- 3. Fan out per-version release builds (they FROM the fresh base) ------
  fanout:
    needs: [plan, base]
    # run after the base resolves; base may be 'skipped' (nothing stale) or 'success'
    if: ${{ always() && needs.plan.result == 'success' && (needs.base.result == 'success' || needs.base.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release builds (oldest first; lone-first on an empty package)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}   # gh has no git checkout here - point it at the repo
          MAIN_MISSING: ${{ needs.plan.outputs.main_missing }}
          BASE_VARIANT: ${{ needs.plan.outputs.base_variant }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          NATIVE_V: ${{ needs.plan.outputs.native_versions }}
          X_V: ${{ needs.plan.outputs.x_versions }}
          WOLFI_V: ${{ needs.plan.outputs.wolfi_versions }}
        run: |
          set -euo pipefail
          native="${NATIVE_V}"; x="${X_V}"; wolfi="${WOLFI_V}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN - nothing built or dispatched."
            echo "  stale base to rebuild : ${BASE_VARIANT}"
            echo "  main package missing  : ${MAIN_MISSING}"
            echo "  would dispatch native : ${native:-<none>}"
            echo "  would dispatch -x     : ${x:-<none>}"
            echo "  would dispatch Wolfi  : ${wolfi:-<none>}"
            exit 0
          fi
          if [ -z "${native}${x}${wolfi}" ]; then echo "nothing to build"; exit 0; fi
          if [ "$MAIN_MISSING" = "true" ]; then
            first="$(printf '%s\n%s\n%s\n' $native $x $wolfi | grep -E '^v' | sort -uV | head -n1 || true)"
            echo "FIRST SEED: compile-tyk-plugin package absent - dispatching ONE build (${first:-none}) to create+link it serially; the rest fan out next run (no creation race)."
            if [ -n "$first" ]; then gh workflow run build.yml -f gateway_version="$first" -f push=true || echo "WARN: dispatch failed $first"; fi
            exit 0
          fi
          ok=0; fail=0
          for v in $native; do echo "dispatch native $v"; if gh workflow run build.yml       -f gateway_version="$v" -f push=true;             then ok=$((ok+1)); else echo "WARN: native dispatch failed $v"; fail=$((fail+1)); fi; done
          for v in $x;      do echo "dispatch -x $v";     if gh workflow run build.yml       -f gateway_version="$v" -f variant=x -f push=true; then ok=$((ok+1)); else echo "WARN: -x dispatch failed $v";     fail=$((fail+1)); fi; done
          for v in $wolfi;  do echo "dispatch Wolfi $v";  if gh workflow run build-wolfi.yml -f gateway_version="$v" -f push=true;              then ok=$((ok+1)); else echo "WARN: wolfi dispatch failed $v";  fail=$((fail+1)); fi; done
          echo "dispatched ok=$ok failed=$fail"
          # per-item resilience (one bad dispatch never blocks the rest), but a TOTAL failure
          # (e.g. wrong repo/permissions) must fail loudly, not look like a successful no-op.
          [ "$ok" -gt 0 ] || { echo "::error::all ${fail} dispatch(es) failed - see WARNs above"; exit 1; }
