name: watch

# What to build/maintain is declared in releases.yml (the support policy) and resolved by
# scripts/resolve-releases.sh into ACTIVE (base-CVE-updated) + FROZEN (built once, kept) sets,
# intersected with buildable Gateway versions (git tag AND published image). This watcher acts on
# that, prune.yml enforces the same policy on the registry - one source of truth, no drift.
#
# Triggers:
#   * MISSING IMAGE     -> build it (new gateway release, or first-run backfill of a maintained
#                          line's older/frozen patches). Both DHI + Wolfi.
#   * EDITION/ARCH DRIFT -> rebuild (ACTIVE only; e.g. an edition gains s390x).
#   * STALE BASE        -> re-stack any ACTIVE version not on the live base. LEVEL-triggered per
#                          version (compares each image's recorded io.ctp.dhi-base-digest to the
#                          live base), so a capped/failed run just catches up next time - no
#                          silent staleness. DHI and Wolfi bases are checked INDEPENDENTLY.
# Editions ce/ee/ee-fips all ship from one image per version. See docs/maintenance.md + SUPPORT.md.

on:
  schedule:
    - cron: "17 6 * * *"            # daily ~06:17 UTC
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild all maintained versions regardless of changes"
        required: false
        type: boolean
        default: false
      max_dispatch:
        description: "Cap builds dispatched per run (throttles the first-run backfill; raise for faster catch-up)"
        required: false
        type: string
        default: "12"

permissions:
  contents: read
  actions: write                      # dispatch build.yml
  packages: read                      # read existing tags / base label

env:
  IMAGE_NAME: compile-tyk-plugin
  DHI_BASE: dhi.io/debian-base:trixie-debian13-dev
  WOLFI_BASE: cgr.dev/chainguard/wolfi-base:latest
  GHCR_NS: ${{ github.repository_owner }}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check required config
        env:
          DH_USER: ${{ vars.DOCKERHUB_USER }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DH_USER" ]  || { echo "::error::Set repository VARIABLE DOCKERHUB_USER (Docker Hub username + push namespace)."; exit 1; }
          [ -n "$DH_TOKEN" ] || { echo "::error::Set repository SECRET DOCKERHUB_TOKEN (Docker Hub Read & Write PAT)."; exit 1; }
      - uses: imjasonh/setup-crane@v0.4
      - name: Login to dhi.io
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Docker Hub
        # authenticated crane ls/manifest against tykio/* (avoids anonymous rate limits)
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide what to (re)build and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL: ${{ inputs.force_all || 'false' }}
          MAX_DISPATCH: ${{ inputs.max_dispatch || '12' }}
          SOURCE_REPO: TykTechnologies/tyk
          GW_CE_REPO: tykio/tyk-gateway
        run: |
          set -euo pipefail
          img="ghcr.io/${GHCR_NS}/${IMAGE_NAME}"

          # Live base digests - the source a compiler SHOULD be stacked on. A compiler image records
          # the base it was built from in io.ctp.dhi-base-digest (inherited from the base; the Wolfi
          # compiler records the Wolfi base digest the same way).
          dhi_now="$(crane digest "${DHI_BASE}")"
          wolfi_now="$(crane digest "${WOLFI_BASE}")"
          echo "live base: DHI=$dhi_now WOLFI=$wolfi_now"

          # Resolve releases.yml -> ACTIVE (base-CVE-current) + FROZEN (built once, kept). Editions
          # ce/ee/fips all ship from one image per version. Shared with prune.yml so they can't drift.
          resolved="$(GW_CE_REPO="$GW_CE_REPO" SOURCE_REPO="$SOURCE_REPO" bash scripts/resolve-releases.sh)"
          active="$(printf '%s\n' "$resolved" | awk '$1=="ACTIVE"{print $2}')"
          frozen="$(printf '%s\n' "$resolved" | awk '$1=="FROZEN"{print $2}')"
          [ -n "$active$frozen" ] || { echo "::error::empty policy set (resolve-releases failed?) - aborting"; exit 1; }
          echo "policy: $(printf '%s\n' $active|grep -c .) active, $(printf '%s\n' $frozen|grep -c .) frozen"

          live_archs() { crane manifest "$1" 2>/dev/null \
            | jq -r '[.manifests[]?|select((.platform.os//"")=="linux" and (.platform.architecture//"")!="unknown")|.platform.architecture]|sort|unique|join(",")' 2>/dev/null || true; }
          base_of() { crane config "$1" 2>/dev/null | jq -r '.config.Labels["io.ctp.dhi-base-digest"] // empty'; }
          need_dhi=""; need_wolfi=""

          # (1) ACTIVE is LEVEL-TRIGGERED: re-stack a version whenever its image is missing OR not on
          #     the live base (its recorded io.ctp.dhi-base-digest != live). This CONVERGES even when
          #     a run is capped by MAX_DISPATCH or a build fails - every run re-checks each version's
          #     ACTUAL base, so laggards catch up over later runs instead of silently going stale.
          #     (A global edge-triggered base-change flag would 'consume' the trigger after the first
          #     re-stack and strand the rest.) Per variant - DHI and Wolfi bases move independently.
          for v in $active; do
            cfg="$(crane config "${img}:${v}" 2>/dev/null || echo '{}')"
            dhi_have="$(echo "$cfg" | jq -r '.config.Labels["io.ctp.dhi-base-digest"] // empty')"
            if [ "$FORCE_ALL" = "true" ] || [ "$dhi_have" != "$dhi_now" ]; then
              echo "-> $v: DHI re-stack (on ${dhi_have:-<missing>}, want ${dhi_now})"; need_dhi="$need_dhi $v"; fi
            wolfi_have="$(base_of "${img}:${v}-wolfi")"
            if [ "$FORCE_ALL" = "true" ] || [ "$wolfi_have" != "$wolfi_now" ]; then
              echo "-> $v: Wolfi re-stack (on ${wolfi_have:-<missing>}, want ${wolfi_now})"; need_wolfi="$need_wolfi $v"; fi
            # edition/arch coverage drift (read from the existing DHI image) -> rebuild both variants
            [ "$cfg" = '{}' ] && continue
            for spec in "ce:tykio/tyk-gateway" "ee:tykio/tyk-gateway-ee" "fips:tykio/tyk-gateway-fips"; do
              ed="${spec%%:*}"; gw="${spec##*:}"
              live="$(live_archs "${gw}:${v}")"; have="$(echo "$cfg" | jq -r --arg k "io.ctp.${ed}-archs" '.config.Labels[$k] // ""')"
              [ "$live" != "$have" ] && { echo "-> $v: $ed arch drift ('${have}' -> '${live}')"; need_dhi="$need_dhi $v"; need_wolfi="$need_wolfi $v"; }
            done
          done
          # (2) FROZEN: build once if the image is missing; never re-stacked on a base change.
          for v in $frozen; do
            crane manifest "${img}:${v}"       >/dev/null 2>&1 || { echo "-> $v: no DHI image (frozen)";   need_dhi="$need_dhi $v"; }
            crane manifest "${img}:${v}-wolfi" >/dev/null 2>&1 || { echo "-> $v: no Wolfi image (frozen)"; need_wolfi="$need_wolfi $v"; }
          done

          # dedupe + cap per run (MAX_DISPATCH spreads a big backfill / re-stack over days), dispatch.
          dhi_uniq="$(echo $need_dhi     | tr ' ' '\n' | grep -E '^v' | sort -u | head -n "${MAX_DISPATCH}" || true)"
          wolfi_uniq="$(echo $need_wolfi | tr ' ' '\n' | grep -E '^v' | sort -u | head -n "${MAX_DISPATCH}" || true)"
          [ -n "$dhi_uniq$wolfi_uniq" ] || { echo "nothing to build"; exit 0; }
          for v in $dhi_uniq;   do echo "dispatch DHI $v";   gh workflow run build.yml       -f gateway_version="$v" -f push=true || echo "WARN: dhi dispatch failed $v";   done
          for v in $wolfi_uniq; do echo "dispatch Wolfi $v"; gh workflow run build-wolfi.yml -f gateway_version="$v" -f push=true || echo "WARN: wolfi dispatch failed $v"; done
