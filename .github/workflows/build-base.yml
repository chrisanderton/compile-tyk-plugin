name: build-base

# Builds the STABLE base layer(s) - toolchains + glibc sysroots, no Go, no Gateway source -
# ONCE, independently of any Gateway version. Per-version release builds (build.yml /
# build-wolfi.yml) then just `FROM` the published `-base:latest`, so the slow base work is
# never repeated per version. Publishes:
#   compile-tyk-plugin-base:latest        (DHI variant)
#   compile-tyk-plugin-base-slim:latest   (DHI base + SLIM purge - same toolchains, lower CVE)
#   compile-tyk-plugin-base-wolfi:latest  (Wolfi variant)
# plus their :buildcache. The variants run as separate matrix legs writing to separate
# packages, so first-creation is serial per package (no concurrent-creation permission race).
#
# Trigger it directly to refresh a base on a CVE bump, or let watch.yml call it (workflow_call)
# before fanning out release re-stacks. The DHI/slim and Wolfi bases move independently - rebuild
# only the one(s) whose upstream digest changed via the `variant` input (slim shares DHI's
# upstream, so it re-bases whenever DHI does).
#
# Config: DOCKERHUB_USER (repo variable = username + namespace), DOCKERHUB_TOKEN (repo secret =
# Read & Write PAT; also pulls the dhi.io base). GHCR uses the built-in GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which base(s) to build"
        required: false
        type: choice
        options: [all, dhi, wolfi, slim]
        default: all
      glibc_target:
        description: "Plugin glibc floor baked into the sysroot: 2.17 (RHEL 7+, default) or 2.31"
        required: false
        type: string
        default: "2.17"
  workflow_call:
    inputs:
      variant:
        required: false
        type: string
        default: all
      glibc_target:
        required: false
        type: string
        default: "2.17"
    secrets:
      DOCKERHUB_TOKEN:
        required: true

env:
  IMAGE_NAME: compile-tyk-plugin
  DHI_BASE: dhi.io/debian-base:trixie-debian13-dev
  WOLFI_BASE: cgr.dev/chainguard/wolfi-base:latest
  GHCR_NS: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # Resolve the requested variant(s) into a build matrix (mirrors the gate_matrix idiom):
  # one entry per base flavour, carrying its upstream image, package suffix and labels.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      glibc_suffix: ${{ steps.m.outputs.glibc_suffix }}
    steps:
      - name: Check required config
        env:
          DH_USER: ${{ vars.DOCKERHUB_USER }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DH_USER" ]  || { echo "::error::Set repository VARIABLE DOCKERHUB_USER."; exit 1; }
          [ -n "$DH_TOKEN" ] || { echo "::error::Set repository SECRET DOCKERHUB_TOKEN (Read & Write PAT)."; exit 1; }
      - id: m
        env:
          VARIANT: ${{ inputs.variant }}
          GLIBC: ${{ inputs.glibc_target }}
        run: |
          set -euo pipefail
          g="${GLIBC:-2.17}"
          if [ "$g" = "2.17" ]; then echo "glibc_suffix=" >> "$GITHUB_OUTPUT"; else echo "glibc_suffix=-glibc$g" >> "$GITHUB_OUTPUT"; fi
          dhi='{"variant":"dhi","base":"'"${DHI_BASE}"'","suffix":"-base","title":"compile-tyk-plugin-base","flavour":"DHI","slim":"0"}'
          wolfi='{"variant":"wolfi","base":"'"${WOLFI_BASE}"'","suffix":"-base-wolfi","title":"compile-tyk-plugin-base-wolfi","flavour":"Wolfi","slim":"0"}'
          # slim = the DHI base with the SLIM purge applied (Debian cruft removed, scanner manifest
          # reconciled, curl omitted). Same upstream base + cross toolchains as DHI; SLIM=1 gates it.
          slim='{"variant":"slim","base":"'"${DHI_BASE}"'","suffix":"-base-slim","title":"compile-tyk-plugin-base-slim","flavour":"DHI (slim)","slim":"1"}'
          # VARIANT is a single keyword (all|dhi|wolfi|slim) OR a space-separated subset - the
          # watcher passes e.g. "dhi slim" because slim shares the DHI upstream digest and so
          # re-bases whenever DHI does. "all" (the default) expands to all three.
          req="${VARIANT:-all}"; [ "$req" = "all" ] && req="dhi wolfi slim"
          entries=""
          for v in $req; do
            case "$v" in
              dhi)   entries="$entries,$dhi"   ;;
              wolfi) entries="$entries,$wolfi" ;;
              slim)  entries="$entries,$slim"  ;;
              *)     echo "::warning::unknown base variant '$v' (skipped)" ;;
            esac
          done
          [ -n "$entries" ] || { echo "::error::no valid base variant in '$req'"; exit 1; }
          printf 'matrix=[%s]\n' "${entries#,}" >> "$GITHUB_OUTPUT"

  base:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: imjasonh/setup-crane@v0.4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to dhi.io (pull the DHI base)
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to Docker Hub (push the base mirror)
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pin the upstream base by digest so the build is reproducible and the digest can be
      # recorded in io.ctp.dhi-base-digest (the label the watcher's level-trigger compares).
      - id: up
        run: echo "digest=$(crane digest ${{ matrix.base }})" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true   # SLSA provenance + SPDX SBOM attestations on the base index too
          sbom: true
          # index:* annotations populate the GHCR/Docker Hub package description + repo link for
          # the multi-arch base index (a per-arch LABEL alone does not reach the index).
          annotations: |
            index:org.opencontainers.image.title=${{ matrix.title }}
            index:org.opencontainers.image.description=Stable ${{ matrix.flavour }} toolchain + glibc sysroot base for compile-tyk-plugin (no Go, no Gateway source). Community/unofficial.
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=MPL-2.0
          build-args: |
            BASE_IMAGE=${{ matrix.base }}@${{ steps.up.outputs.digest }}
            DHI_DIGEST=${{ steps.up.outputs.digest }}
            GLIBC_TARGET=${{ inputs.glibc_target || '2.17' }}
            SLIM=${{ matrix.slim }}
          tags: |
            ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:latest${{ needs.plan.outputs.glibc_suffix }}
            docker.io/${{ vars.DOCKERHUB_USER }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:latest${{ needs.plan.outputs.glibc_suffix }}
          cache-from: type=registry,ref=ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:buildcache${{ needs.plan.outputs.glibc_suffix }}
          cache-to: type=registry,ref=ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}:buildcache${{ needs.plan.outputs.glibc_suffix }},mode=max
