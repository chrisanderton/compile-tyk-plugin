name: build-wolfi

# Wolfi variant of compile-tyk-plugin, for teams standardised on Chainguard.
# Wolfi is glibc-based and ships no cross-compilers, so this variant builds
# NATIVELY for amd64 and arm64 only (no s390x, no cross). It reuses the same
# resolver as the default (DHI) pipeline and publishes `:vX.Y.Z-wolfi` tags.
#
# The STABLE Wolfi base is NOT built here - it is built once by build-base.yml
# (variant wolfi) and this workflow just `FROM`s compile-tyk-plugin-base-wolfi:latest.
#
# Config: DOCKERHUB_USER (repo variable = username + namespace) and DOCKERHUB_TOKEN
# (repo secret = Docker Hub PAT, Read & Write). GHCR uses the built-in GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      gateway_version: { description: "Gateway version, e.g. v5.13.0", required: true, type: string }
      push:           { description: "Push to registries", required: false, type: boolean, default: true }
      glibc_target:   { description: "Plugin glibc floor: 2.17 (RHEL 7+, default) or 2.31", required: false, type: string, default: "2.17" }
  workflow_call:
    inputs:
      gateway_version: { required: true, type: string }
      push:           { required: false, type: boolean, default: true }
      glibc_target:   { required: false, type: string, default: "2.17" }
    secrets:
      DOCKERHUB_TOKEN: { required: true }

env:
  IMAGE_NAME: compile-tyk-plugin
  GHCR_NS: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      go_version: ${{ steps.r.outputs.GO_VERSION }}
      gateway_trimpath: ${{ steps.r.outputs.GATEWAY_TRIMPATH }}
      gateway_src_root: ${{ steps.r.outputs.GATEWAY_SRC_ROOT }}
      github_sha: ${{ steps.r.outputs.GITHUB_SHA }}
      github_tag: ${{ steps.r.outputs.GITHUB_TAG }}
      sha_amd64:  ${{ steps.r.outputs.GO_SHA256_amd64 }}
      sha_arm64:  ${{ steps.r.outputs.GO_SHA256_arm64 }}
      base_ref:   ${{ steps.basepin.outputs.ref }}
      ee_available:      ${{ steps.r.outputs.EE_AVAILABLE }}
      ee_build_tag:      ${{ steps.r.outputs.EE_BUILD_TAG }}
      fips_available:    ${{ steps.r.outputs.FIPS_AVAILABLE }}
      fips_gofips140:    ${{ steps.r.outputs.FIPS_GOFIPS140 }}
      fips_goexperiment: ${{ steps.r.outputs.FIPS_GOEXPERIMENT }}
      fips_build_tag:    ${{ steps.r.outputs.FIPS_BUILD_TAG }}
      # native subset only (amd64/arm64) - Wolfi cannot cross-compile
      ce_archs:   ${{ steps.n.outputs.ce }}
      ee_archs:   ${{ steps.n.outputs.ee }}
      fips_archs: ${{ steps.n.outputs.fips }}
      gate_matrix: ${{ steps.gm.outputs.matrix }}
      date:  ${{ steps.meta.outputs.date }}
      dh_ns: ${{ steps.meta.outputs.dh_ns }}
      glibc_suffix: ${{ steps.meta.outputs.glibc_suffix }}
    steps:
      - uses: actions/checkout@v5
      - name: Check required config
        env:
          DH_USER: ${{ vars.DOCKERHUB_USER }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DH_USER" ]  || { echo "::error::Set repository VARIABLE DOCKERHUB_USER (Docker Hub username + push namespace)."; exit 1; }
          [ -n "$DH_TOKEN" ] || { echo "::error::Set repository SECRET DOCKERHUB_TOKEN (Docker Hub Read & Write PAT)."; exit 1; }
      - uses: imjasonh/setup-crane@v0.4
      - uses: actions/setup-go@v6
        with:
          go-version: "stable"
          # resolve-gateway.sh only needs `go version -m`; no runner-side module
          # downloads, so disable the default cache (avoids the missing go/pkg/mod warning).
          cache: false
      - id: r
        run: ./scripts/resolve-gateway.sh "${{ inputs.gateway_version }}"
      - id: n
        run: |
          native() { echo "$1" | tr ',' '\n' | grep -E '^(amd64|arm64)$' | paste -sd, -; }
          echo "ce=$(native "${{ steps.r.outputs.CE_ARCHS }}")"     >> "$GITHUB_OUTPUT"
          echo "ee=$(native "${{ steps.r.outputs.EE_ARCHS }}")"     >> "$GITHUB_OUTPUT"
          echo "fips=$(native "${{ steps.r.outputs.FIPS_ARCHS }}")" >> "$GITHUB_OUTPUT"
      - id: gm
        env:
          TAG: ${{ steps.r.outputs.GITHUB_TAG }}
        run: |
          set -euo pipefail
          entries() {  # edition  gateway  "arch,list"
            for a in $(echo "$3" | tr ',' ' '); do
              case "$a" in
                arm64) runner=ubuntu-24.04-arm ;;
                *)     runner=ubuntu-latest ;;
              esac
              # Wolfi is native-only (no cross toolchain; arches already filtered to amd64/arm64
              # by step n), so the candidate to gate is the one built for THIS arch: build_arch=arch.
              echo "{\"edition\":\"$1\",\"arch\":\"$a\",\"gateway\":\"$2:$TAG\",\"runner\":\"$runner\",\"build_arch\":\"$a\"}"
            done
          }
          # if/then (not `[ ] && entries`): a false edition check must not leave the block
          # non-zero, or pipefail+set -e fails the step for CE-only releases (no EE/FIPS).
          {
            entries ce tykio/tyk-gateway "${{ steps.n.outputs.ce }}"
            if [ "${{ steps.r.outputs.EE_AVAILABLE }}" = "true" ];   then entries ee tykio/tyk-gateway-ee "${{ steps.n.outputs.ee }}"; fi
            if [ "${{ steps.r.outputs.FIPS_AVAILABLE }}" = "true" ]; then entries ee-fips tykio/tyk-gateway-fips "${{ steps.n.outputs.fips }}"; fi
          } | jq -sc . | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"
      - name: Login to GHCR (read the prebuilt Wolfi base digest)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "dh_ns=${{ vars.DOCKERHUB_USER }}" >> "$GITHUB_OUTPUT"
          # Non-default glibc floors get a tag + buildcache suffix so a 2.31 build never
          # overwrites the canonical 2.17 default images (empty => 2.17, untouched).
          g="${{ inputs.glibc_target }}"; g="${g:-2.17}"
          if [ "$g" = "2.17" ]; then echo "glibc_suffix=" >> "$GITHUB_OUTPUT"; else echo "glibc_suffix=-glibc$g" >> "$GITHUB_OUTPUT"; fi
      # Pin the Wolfi base built by build-base.yml (variant wolfi). The compiler FROMs this
      # exact digest and inherits its io.ctp.dhi-base-digest label.
      - id: basepin
        env:
          SFX: ${{ steps.meta.outputs.glibc_suffix }}
        run: |
          base="ghcr.io/${GHCR_NS}/${IMAGE_NAME}-base-wolfi:latest${SFX}"
          d="$(crane digest "$base")" || { echo "::error::base image $base not found - run build-base.yml (variant wolfi${SFX:+, glibc_target ${SFX#-glibc}}) first."; exit 1; }
          echo "ref=ghcr.io/${GHCR_NS}/${IMAGE_NAME}-base-wolfi@${d}" >> "$GITHUB_OUTPUT"

  # Build the Wolfi compiler ONCE per arch (edition-agnostic), push to GHCR by digest.
  # Native amd64/arm64 only - Wolfi has no cross toolchain. Reused by gate + publish.
  # FROMs the prebuilt Wolfi base pinned by resolve (no base build here).
  build-candidate:
    needs: [resolve]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5            # this repo: provides Dockerfile.release
      - name: Checkout Gateway source @ release commit
        uses: actions/checkout@v5
        with:
          repository: TykTechnologies/tyk
          ref: ${{ needs.resolve.outputs.github_tag }}
          path: tyk-src
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: tyk-src
          file: Dockerfile.release
          platforms: linux/${{ matrix.arch }}
          provenance: true
          sbom: true
          outputs: type=image,name=ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BASE_IMAGE=${{ needs.resolve.outputs.base_ref }}
            GO_VERSION=${{ needs.resolve.outputs.go_version }}
            GATEWAY_TRIMPATH=${{ needs.resolve.outputs.gateway_trimpath }}
            GATEWAY_SRC_ROOT=${{ needs.resolve.outputs.gateway_src_root }}
            GO_SHA256_amd64=${{ needs.resolve.outputs.sha_amd64 }}
            GO_SHA256_arm64=${{ needs.resolve.outputs.sha_arm64 }}
            GITHUB_SHA=${{ needs.resolve.outputs.github_sha }}
            GITHUB_TAG=${{ needs.resolve.outputs.github_tag }}
            EE_AVAILABLE=${{ needs.resolve.outputs.ee_available }}
            EE_BUILD_TAG=${{ needs.resolve.outputs.ee_build_tag }}
            FIPS_AVAILABLE=${{ needs.resolve.outputs.fips_available }}
            FIPS_GOFIPS140=${{ needs.resolve.outputs.fips_gofips140 }}
            FIPS_GOEXPERIMENT=${{ needs.resolve.outputs.fips_goexperiment }}
            FIPS_BUILD_TAG=${{ needs.resolve.outputs.fips_build_tag }}
            CE_ARCHS=${{ needs.resolve.outputs.ce_archs }}
            EE_ARCHS=${{ needs.resolve.outputs.ee_archs }}
            FIPS_ARCHS=${{ needs.resolve.outputs.fips_archs }}
          cache-from: type=registry,ref=ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }}:buildcache-wolfi-${{ matrix.arch }}${{ needs.resolve.outputs.glibc_suffix }}
          cache-to: type=registry,ref=ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }}:buildcache-wolfi-${{ matrix.arch }}${{ needs.resolve.outputs.glibc_suffix }},mode=max
      - name: Export per-arch digest
        run: |
          mkdir -p /tmp/digest
          printf '%s' "${{ steps.build.outputs.digest }}" > /tmp/digest/${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-digest-wolfi-${{ matrix.arch }}
          path: /tmp/digest/${{ matrix.arch }}
          retention-days: 1

  gate:
    needs: [resolve, build-candidate]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.gate_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Login to GHCR (pull candidate)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: candidate-digest-wolfi-${{ matrix.build_arch }}
          path: /tmp/digest
      - name: Gate - ${{ matrix.edition }} / ${{ matrix.arch }} (native; must load into its Gateway)
        run: |
          DIGEST="$(cat /tmp/digest/${{ matrix.build_arch }})"
          ./scripts/loadtest-gate.sh \
            "ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }}@${DIGEST}" \
            ${{ matrix.gateway }} ${{ matrix.edition }} ${{ matrix.arch }}

  # Stitch the gated per-arch Wolfi images into one multi-arch -wolfi manifest. No rebuild.
  publish:
    needs: [resolve, build-candidate, gate]
    if: ${{ inputs.push }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-digest-wolfi-*
          path: /tmp/digest
          merge-multiple: true
      - name: Assemble multi-arch -wolfi manifest from the gated per-arch images
        env:
          GHCR_IMG: ghcr.io/${{ env.GHCR_NS }}/${{ env.IMAGE_NAME }}
          DH_IMG: docker.io/${{ needs.resolve.outputs.dh_ns }}/${{ env.IMAGE_NAME }}
          TAG: ${{ needs.resolve.outputs.github_tag }}
          DATE: ${{ needs.resolve.outputs.date }}
          SFX: ${{ needs.resolve.outputs.glibc_suffix }}
        run: |
          AMD="$(cat /tmp/digest/amd64)"
          ARM="$(cat /tmp/digest/arm64)"
          # ${SFX} keeps an opt-in 2.31 build on its own tags (e.g. :v5.13.0-wolfi-glibc2.31),
          # never overwriting the 2.17 default (:v5.13.0-wolfi). Empty for 2.17.
          # index:* annotations populate the GHCR package description + repo link for the
          # multi-arch index (a per-arch LABEL does not propagate to the index).
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=compile-tyk-plugin" \
            --annotation "index:org.opencontainers.image.description=Community/unofficial modern low-CVE compiler for Tyk Go plugins (Wolfi base, glibc-2.17 sysroot default). Not affiliated with Tyk." \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.licenses=MPL-2.0" \
            -t "${GHCR_IMG}:${TAG}-wolfi${SFX}" -t "${GHCR_IMG}:${TAG}-wolfi${SFX}-${DATE}" \
            -t "${DH_IMG}:${TAG}-wolfi${SFX}"   -t "${DH_IMG}:${TAG}-wolfi${SFX}-${DATE}" \
            "${GHCR_IMG}@${AMD}" "${GHCR_IMG}@${ARM}"
